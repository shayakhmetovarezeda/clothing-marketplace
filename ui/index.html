<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин одежды</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h3 { margin: 10px 0 4px; font-size: 16px; }
    .price { font-weight: bold; color: #22aa77; font-size: 18px; }
    .meta { color: #888; font-size: 13px; }
    .empty { color: #999; padding: 40px; text-align: center; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .noimg { width: 100%; height: 200px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #aaa; }
    .auth { background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .auth input { padding: 8px; margin-right: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .auth button { padding: 8px 16px; margin-right: 8px; border: none; border-radius: 6px; background: #22aa77; color: white; cursor: pointer; }
    .auth button:hover { background: #1c8a60; }
    #userInfo { color: #333; font-weight: bold; }
    .create { background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .create h3 { margin: 0 0 12px; }
    .create input { padding: 8px; margin: 0 8px 8px 0; border: 1px solid #ddd; border-radius: 6px; }
    .create button { padding: 8px 16px; border: none; border-radius: 6px; background: #3377dd; color: white; cursor: pointer; }
    .create button:hover { background: #285cb0; }
  </style>
</head>
<body>
  <h1>Магазин одежды</h1>
  <div id="auth" class="auth">
    <span id="loginForm">
      <input id="email" type="email" placeholder="email">
      <input id="password" type="password" placeholder="пароль">
      <button onclick="register()">Регистрация</button>
      <button onclick="login()">Войти</button>
    </span>
    <span id="userInfo"></span>
  </div>
  <div id="createForm" class="create" style="display:none;">
    <h3>Продать вещь</h3>
    <input id="c_title" placeholder="Название">
    <input id="c_price" type="number" placeholder="Цена">
    <input id="c_size" placeholder="Размер">
    <input id="c_brand" placeholder="Бренд">
    <input id="c_category" placeholder="Категория">
    <input id="c_description" placeholder="Описание">
    <button onclick="createItem()">Разместить товар</button>
  </div>
  <div id="items" class="grid"></div>

  <script>
    const API = "http://127.0.0.1:8000";

    // храним токен между перезагрузками страницы
    let token = localStorage.getItem("token");

    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        const res = await fetch(API + "/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });
        if (res.ok) {
          alert("Регистрация успешна! Теперь войдите.");
        } else {
          const err = await res.json();
          alert("Ошибка: " + (err.detail || "не удалось зарегистрироваться"));
        }
      } catch (e) {
        alert("Ошибка соединения с сервером");
      }
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        // /login принимает данные формой, не JSON
        const form = new URLSearchParams();
        form.append("username", email);
        form.append("password", password);

        const res = await fetch(API + "/login", {
          method: "POST",
          body: form
        });
        if (res.ok) {
          const data = await res.json();
          token = data.access_token;
          localStorage.setItem("token", token);
          updateAuthUI();
          alert("Вы вошли!");
        } else {
          alert("Неверный email или пароль");
        }
      } catch (e) {
        alert("Ошибка соединения с сервером");
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem("token");
      updateAuthUI();
    }
    async function createItem() {
      if (!token) {
        alert("Сначала войдите");
        return;
      }
      const body = {
        title: document.getElementById("c_title").value,
        price: parseFloat(document.getElementById("c_price").value),
        size: document.getElementById("c_size").value,
        brand: document.getElementById("c_brand").value,
        category: document.getElementById("c_category").value,
        description: document.getElementById("c_description").value
      };

      try {
        const res = await fetch(API + "/items", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token   // прикладываем токен
          },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          alert("Товар размещён!");
          loadItems();  // обновляем витрину
        } else {
          const err = await res.json();
          alert("Ошибка: " + (err.detail || "не удалось создать товар"));
        }
      } catch (e) {
        alert("Ошибка соединения");
      }
    }


    function updateAuthUI() {
      const info = document.getElementById("userInfo");
      const form = document.getElementById("loginForm");
      const createForm = document.getElementById("createForm");
      if (token) {
        form.style.display = "none";
        createForm.style.display = "block";
        info.innerHTML = 'Вы вошли. <button onclick="logout()">Выйти</button>';
      } else {
        form.style.display = "inline";
        createForm.style.display = "none";
        info.innerHTML = "";
      }
    }

    async function loadItems() {
      const container = document.getElementById("items");
      try {
        const res = await fetch(API + "/items");
        const items = await res.json();

        if (items.length === 0) {
          container.innerHTML = '<p class="empty">Пока нет товаров</p>';
          return;
        }

        let html = "";
        for (const item of items) {
          // запрашиваем фото этого товара
          let photoTag = '<div class="noimg">нет фото</div>';
          try {
            const pRes = await fetch(API + "/items/" + item.id + "/photos");
            const photos = await pRes.json();
            if (photos.length > 0) {
              photoTag = '<img src="' + photos[0] + '" alt="' + item.title + '">';
            }
          } catch (e) {}

          html +=
            '<div class="card">' +
              photoTag +
              '<h3>' + item.title + '</h3>' +
              '<div class="price">' + item.price + ' руб.</div>' +
              '<div class="meta">Размер: ' + item.size + ' · ' + (item.brand || "без бренда") + '</div>' +
              '<div class="meta">' + item.category + '</div>' +
            '</div>';
        }
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<p class="empty">Ошибка загрузки. Запущен ли сервер?</p>';
      }
    }
    updateAuthUI();
    loadItems();
  </script>
</body>
</html>
